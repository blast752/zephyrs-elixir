<stop offset="0%" stop-color="#63B5FF"/>
<stop offset="100%" stop-color="#1175E6"/>
</linearGradient>
</defs>
<!-- Document body with clipped top-right corner -->
<path d="M 14,8 L 62,8 L 78,24 L 78,92 L 14,92 Z" rx="8" fill="url(#txtDocGrad)"/>
