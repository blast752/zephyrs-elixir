<rect x="28" y="42" width="35" height="3" rx="2" ry="2" fill="white" opacity="0.95"/>
<!-- Line 2 — 70% width -->
<rect x="22" y="54" width="45" height="3" rx="2" ry="2" fill="white" opacity="0.70"/>
<!-- Line 3 — 70% width -->
<rect x="22" y="65" width="45" height="3" rx="2" ry="2" fill="white" opacity="0.70"/>
<!-- Line 4 — 70% width -->
<rect x="22" y="76" width="45" height="3" rx="2" ry="2" fill="white" opacity="0.70"/>
<!-- TXT label -->
<text x="46" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="white" opacity="0.80">TXT</text>
</svg>
